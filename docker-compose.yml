services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.1
    container_name: ellevio-energy-ha
    environment:
      TZ: Europe/Stockholm
    volumes:
      - ./dev-config:/config
      - ./custom_components/ellevio_energy:/config/custom_components/ellevio_energy:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
