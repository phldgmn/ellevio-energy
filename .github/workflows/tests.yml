name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - name: Lint
        run: uvx ruff check custom_components tests
      - name: Format check
        run: uvx ruff format --check custom_components tests
      - name: Type check
        run: uv run --with "homeassistant==2026.10.1" --with mypy --with probatio mypy custom_components/ellevio_energy tests
      - name: Test
        run: uv run --with "homeassistant==2026.10.1" --with "pytest-homeassistant-custom-component==0.13.372" --with pytest-asyncio python -m pytest -q tests
